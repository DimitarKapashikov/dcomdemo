apiVersion: v1
kind: ConfigMap
metadata:
  name: content
  namespace: {{ include "common.names.namespace" . | quote }}
data:
  index.html: |
      <head>
          <title>ArgoCDaaS</title>
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <style>
              body {
                  margin: 0;
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  min-height: 100vh;
                  background-color: #f8f9fa;
              }
      
              .architecture-img {
                  max-width: 100%;
                  max-height: 100vh;
                  height: auto;
                  object-fit: contain;
              }
          </style>
      </head>
      <body>
          <img src="https://raw.githubusercontent.com/DimitarKapashikov/dcomdemo/main/ai_assistant_architecture.png" alt="AI Assistant Architecture Diagram" class="architecture-img">
      </body>
